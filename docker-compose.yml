# AI Business Workflow Automation System - 一键启动 n8n
# 国内用户：在 /etc/docker/daemon.json（Linux）或 Docker Desktop 设置里加国内镜像加速器后再 up
# 用法：cp .env.example .env && docker compose up -d
services:
  n8n:
    image: n8nio/n8n:latest
    # 国内拉不动镜像时，可临时改成你自己的镜像加速地址，例如：
    # image: registry.cn-hangzhou.aliyuncs.com/your-namespace/n8n:latest
    container_name: ai-business-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    # 关键：把 .env 以「环境变量」形式注入容器（n8n 读环境变量，不读文件）
    # 这样节点里的 {{ $env.FEISHU_* }}、{{ $env.KB_SEARCH_URL }}、{{ $env.LLM_MODEL }} 都能取到
    env_file:
      - .env
    environment:
      # 容器级硬编码默认值（env_file 未提供时兜底；env_file 提供时以 env_file 为准）
      - N8N_PORT=5678
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      # 自动导入工作流（只读挂载，容器内不会改）
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # 一次性导入容器：n8n 不会自动扫描挂载目录，必须显式 import。
  # 用 list:workflow 判空，避免重复 up 时重复导入。
  # 必须与主 n8n 共享同一数据卷（n8n_data），否则导入会写进独立的匿名卷，
  # 主服务看不到任何工作流（AI-01）。
  n8n-import:
    image: n8nio/n8n:latest
    env_file:
      - .env
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(n8n list:workflow --onlyId)" ]; then
          n8n import:workflow --separate --input=/workflows || exit 1
          echo "==> workflows imported"
        else
          echo "==> workflows already present, skip import"
        fi
    restart: "no"

volumes:
  n8n_data:
